name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBUG: "false"
  PYTHONDONTWRITEBYTECODE: "1"
  SECRET_KEY: synthetic-ci-signing-key-at-least-32-characters

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -B validate_critical.py
      - run: python -B validate.py
      - run: python -B -m unittest discover -s tests -p 'test_*.py' -q
      - run: python -B demo.py
      - run: python -B scripts/scan_public_safety.py
      - run: git diff --check

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uraki
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: uraki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uraki -d uraki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://uraki:synthetic-ci-password@localhost:5432/uraki_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -B -m scripts.verify_postgres_constraints
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head
