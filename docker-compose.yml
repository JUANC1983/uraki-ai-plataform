services:

  # ---- PostgreSQL ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uraki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-uraki_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- API (FastAPI) ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uraki}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-uraki_db}
      RUN_MIGRATIONS: "true"
      RUN_SCHEDULER: "true"
      WORKERS: "1"
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Operational Dashboard (Streamlit) ----
  dashboard-ops:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: streamlit run dashboard/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      URAKI_API_URL: http://api:8000
      URAKI_ENV: development
      RUN_MIGRATIONS: "false"
      RUN_SCHEDULER: "false"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Executive Dashboard (Streamlit) ----
  dashboard-exec:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: streamlit run executive.py
      --server.port=8502
      --server.address=0.0.0.0
      --server.headless=true
    ports:
      - "8502:8502"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000/api/v1
      RUN_MIGRATIONS: "false"
      RUN_SCHEDULER: "false"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8502/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
